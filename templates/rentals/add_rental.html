{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3 class="mb-0">
            <i class="fas fa-motorcycle"></i>
            Rent Bike
        </h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {% if form.errors %}

            <div class="alert alert-danger">

                Please correct the errors below.

            </div>

            {% endif %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Customer
                    </label>

                    {{ form.customer }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Bike
                    </label>

                    {{ form.bike }}

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Rent Date
                    </label>

                    {{ form.rent_date }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Daily Rent (₹)
                    </label>

                    {{ form.daily_rent }}

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Security Deposit (₹)
                    </label>

                    {{ form.security_deposit }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Advance Payment (₹)
                    </label>

                    {{ form.advance_payment }}

                </div>

            </div>

            <hr>

            <button type="submit" class="btn btn-success">

                <i class="fas fa-save"></i>
                Save Rental

            </button>

            <a href="{% url 'rental_list' %}"
               class="btn btn-secondary">

                <i class="fas fa-times"></i>
                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
