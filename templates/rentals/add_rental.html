{% extends 'base.html' %}

{% block content %}

<div class="container-fluid">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Rent Bike</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.errors }}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">
                    Save Rental
                </button>

                <a href="{% url 'rental_list' %}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
