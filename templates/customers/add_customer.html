{% extends 'base.html' %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3 class="mb-0">
            <i class="fas fa-user-plus"></i>
            Add Customer
        </h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Customer Name <span class="text-danger">*</span>
                    </label>

                    {{ form.customer_name }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Mobile Number <span class="text-danger">*</span>
                    </label>

                    {{ form.mobile }}

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Aadhaar Number
                    </label>

                    {{ form.aadhaar_number }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Driving License
                    </label>

                    {{ form.driving_license }}

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Address
                </label>

                {{ form.address }}

            </div>

            <hr>

            <button type="submit" class="btn btn-success">

                <i class="fas fa-save"></i>
                Save Customer

            </button>

            <a href="{% url 'customer_list' %}" class="btn btn-secondary">

                <i class="fas fa-times"></i>
                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
