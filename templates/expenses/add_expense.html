{% extends 'base.html' %}

{% block content %}

<div class="card">

    <div class="card-header bg-success text-white">

        <h3>Add Expense</h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">

                <i class="fas fa-save"></i>

                Save Expense

            </button>

            <a href="{% url 'expense_list' %}" class="btn btn-secondary">

                Cancel

            </a>

        </form>

    </div>

</div>

{% endblock %}
